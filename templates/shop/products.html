{% extends "base/base.html" %}

{% block title %}Каталог товарів{% endblock %}

{% block content %}
    <h1>Каталог товарів</h1>
    {% for product in products %}
        <div>
            <h2>{{ product.name }}</h2>
            <p>Ціна: {{ product.price }}</p>
            <a href="{% url 'product_detail' product.pk %}">Детальніше</a>
        </div>
    {% empty %}
        <p>Товарів поки немає</p>
    {% endfor %}
{% endblock %}
